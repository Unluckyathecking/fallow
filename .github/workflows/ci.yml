name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, architecture and packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync locked workspace
        run: uv sync --frozen --dev

      - name: Verify lock file
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Enforce module dependency graph
        run: uv run lint-imports

      - name: Check generated schemas
        shell: bash
        run: |
          uv run python -m fallow_protocol.export_schemas schemas/
          git diff --exit-code -- schemas/

      - name: Build all distributions
        run: uv build --all-packages

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The Site Mode acceptance suite builds cmd/agentctl (and its native fake
      # llama) from this exact head when FALLOW_GO_AGENT_BIN is unset; it never
      # skips, so every test lane needs a Go toolchain.
      - name: Install Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-agent/go.mod

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Sync locked workspace
        run: uv sync --frozen --dev

      - name: Run tests
        run: uv run pytest

  # The unit suite for the Windows install seam: strict join-file validation, the
  # token-free config render, the ACL shape, the -DryRun task render and the
  # admin-context refusals. It is pure PowerShell against real Windows APIs, so
  # it needs no toolchain - only the shell a desk already has.
  windows-pester:
    name: Windows install seam (Pester)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pin Pester 3.4.0, the version inside Windows PowerShell 5.1 the suite is
      # written for: the runner image also carries Pester 5, whose Should syntax
      # is incompatible, and an unpinned import takes the highest version. The
      # runner is elevated, so the admin-context cases run instead of skipping.
      - name: Run the Site Mode Pester suite
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 3.4.0 -ErrorAction Stop
          $result = Invoke-Pester -Script deploy\windows\tests\site-mode.Tests.ps1 -PassThru
          Write-Host "pester: passed=$($result.PassedCount) failed=$($result.FailedCount) skipped=$($result.SkippedCount) pending=$($result.PendingCount)"
          if ($result.PassedCount -lt 1) { throw 'the Pester suite reported no passing test; it did not run' }
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) Pester test(s) failed" }

  offline-bundle:
    name: Offline install bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build verified bundle without model weights
        run: deploy/bundle.sh build --output dist/fallow-offline-bundle

      - name: Verify read-only install preview
        run: |
          deploy/bundle.sh install --bundle dist/fallow-offline-bundle \
            --dry-run --prefix dist/install-preview
          test ! -e dist/install-preview

      - name: Preserve executable modes in archive
        run: tar -czf dist/fallow-offline-bundle.tar.gz -C dist fallow-offline-bundle

      - name: Upload offline bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fallow-offline-bundle
          path: dist/fallow-offline-bundle.tar.gz
          if-no-files-found: error

  # The desk bundle is what a Site Mode machine actually unzips, so prove it
  # assembles and verifies on every push. The release workflow builds the
  # publishable one from the GoReleaser binary; this one only has to be real.
  site-bundle:
    name: Site Mode desk bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-agent/go.mod

      - name: Cross-build the Windows agent
        working-directory: go-agent
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -o dist/agentctl.exe ./cmd/agentctl

      - name: Build and verify the desk bundle
        run: |
          deploy/site-bundle.sh build --agent go-agent/dist/agentctl.exe \
            --version ci --output dist
          # Verify what the zip holds, not the staging tree it was cut from: the
          # zip is the artifact a desk unpacks, so it is the one worth checking.
          unzip -q dist/fallow-site-agent_ci_windows_amd64.zip -d unzipped
          deploy/site-bundle.sh verify unzipped/fallow-site-agent_ci_windows_amd64
