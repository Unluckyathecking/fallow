name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, architecture and packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync locked workspace
        run: uv sync --frozen --dev

      - name: Verify lock file
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Enforce module dependency graph
        run: uv run lint-imports

      - name: Check generated schemas
        shell: bash
        run: |
          uv run python -m fallow_protocol.export_schemas schemas/
          git diff --exit-code -- schemas/

      - name: Build all distributions
        run: uv build --all-packages

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The Site Mode acceptance suite builds cmd/agentctl (and its native fake
      # llama) from this exact head when FALLOW_GO_AGENT_BIN is unset; it never
      # skips, so every test lane needs a Go toolchain.
      - name: Install Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-agent/go.mod

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Sync locked workspace
        run: uv sync --frozen --dev

      - name: Run tests
        run: uv run pytest

  offline-bundle:
    name: Offline install bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build verified bundle without model weights
        run: deploy/bundle.sh build --output dist/fallow-offline-bundle

      - name: Verify read-only install preview
        run: |
          deploy/bundle.sh install --bundle dist/fallow-offline-bundle \
            --dry-run --prefix dist/install-preview
          test ! -e dist/install-preview

      - name: Preserve executable modes in archive
        run: tar -czf dist/fallow-offline-bundle.tar.gz -C dist fallow-offline-bundle

      - name: Upload offline bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fallow-offline-bundle
          path: dist/fallow-offline-bundle.tar.gz
          if-no-files-found: error
