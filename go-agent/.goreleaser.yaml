# GoReleaser config for the Fallow Go agent (cmd/agentctl).
# Docs: https://goreleaser.com. Run from this directory (go-agent/), which holds
# the go.mod. Version and commit are stamped into the binary via ldflags.
version: 2

project_name: fallow-agentctl

builds:
  - id: agentctl
    main: ./cmd/agentctl
    binary: agentctl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
    # The two targets that need no cgo. darwin/arm64 is the third OS E4 ships,
    # but its idle detector is a cgo call into Quartz, so a CGO_ENABLED=0
    # cross-build would ship the unsupported stub and the agent would refuse to
    # start (ADR 098). It is built natively on a macOS runner by the release
    # workflow instead. No speculative targets (no windows/arm64, no
    # darwin/amd64).
    targets:
      - windows_amd64
      - linux_amd64

archives:
  - id: agentctl
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

release:
  github:
    owner: Unluckyathecking
    name: fallow
