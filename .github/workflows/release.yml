name: Go agent release

on:
  pull_request:
    paths:
      - "go-agent/**"
      - ".github/workflows/release.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# Pinned GoReleaser version. Do not float to latest: a release must be
# reproducible from the tag.
env:
  GORELEASER_VERSION: "2.5.0"

jobs:
  # On pull requests: validate the config and cross-build the three per-OS
  # binaries as an artifact. No publish.
  snapshot:
    name: Config check and snapshot build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # Only the PR snapshot dedups; never cancel a tag release mid-publish.
    concurrency:
      group: release-snapshot-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-agent/go.mod
          cache: false

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          install-only: true
          version: ${{ env.GORELEASER_VERSION }}

      - name: Check config
        working-directory: go-agent
        run: goreleaser check

      - name: Snapshot build (windows/amd64, linux/amd64)
        working-directory: go-agent
        run: goreleaser build --snapshot --clean

      - name: Upload snapshot binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agentctl-snapshot
          path: go-agent/dist/**/agentctl*
          if-no-files-found: error

  # macOS idle detection is a cgo call into Quartz, so darwin/arm64 cannot be
  # cross-built by GoReleaser: it needs a macOS runner with CGO_ENABLED=1. On a
  # pull request that build runs here, so a broken cgo detector fails before a
  # tag is ever cut.
  snapshot-macos:
    name: Native darwin/arm64 build
    if: github.event_name != 'push'
    runs-on: macos-latest
    concurrency:
      group: release-snapshot-macos-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-agent/go.mod
          cache: false

      - name: Assert the Quartz detector is compiled in
        working-directory: go-agent
        env:
          CGO_ENABLED: "1"
        run: |
          cgo_files="$(go list -f '{{ .CgoFiles }}' ./idle)"
          if [ "${cgo_files}" = "[]" ]; then
            echo "idle has no cgo files: this build would ship the unsupported stub" >&2
            exit 1
          fi

      - name: Snapshot build (darwin/arm64, cgo)
        working-directory: go-agent
        env:
          CGO_ENABLED: "1"
          GOARCH: arm64
        run: go build -trimpath -o dist/agentctl ./cmd/agentctl

      - name: Upload snapshot binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agentctl-snapshot-darwin-arm64
          path: go-agent/dist/agentctl
          if-no-files-found: error

  # On tag push (v*): build the archives and publish a GitHub Release.
  release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-agent/go.mod
          cache: false

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          install-only: true
          version: ${{ env.GORELEASER_VERSION }}

      - name: Release
        working-directory: go-agent
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The darwin/arm64 half of the release, built natively so idle detection (a
  # cgo call into Quartz) is really in the binary. It reproduces GoReleaser's
  # archive by hand — same name, same contents, same `-trimpath` and ldflags —
  # and appends its line to the checksums.txt the job above published.
  release-macos:
    name: Publish darwin/arm64 archive
    if: github.event_name == 'push'
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-agent/go.mod
          cache: false

      - name: Assert the Quartz detector is compiled in
        working-directory: go-agent
        env:
          CGO_ENABLED: "1"
        run: |
          cgo_files="$(go list -f '{{ .CgoFiles }}' ./idle)"
          if [ "${cgo_files}" = "[]" ]; then
            echo "idle has no cgo files: this build would ship the unsupported stub" >&2
            exit 1
          fi

      - name: Build and package (darwin/arm64, cgo)
        working-directory: go-agent
        env:
          CGO_ENABLED: "1"
          GOARCH: arm64
        run: |
          version="${GITHUB_REF_NAME#v}"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA}" \
            -o dist/agentctl ./cmd/agentctl
          # GoReleaser's default archive carries the binary plus the README next
          # to the go.mod; match it so every OS ships the same shape.
          cp README.md dist/README.md
          tar -czf "fallow-agentctl_${version}_darwin_arm64.tar.gz" -C dist agentctl README.md

      - name: Attach to the release and extend checksums.txt
        working-directory: go-agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="fallow-agentctl_${version}_darwin_arm64.tar.gz"
          gh release download "${GITHUB_REF_NAME}" --pattern checksums.txt --dir .
          shasum -a 256 "${archive}" >> checksums.txt
          gh release upload "${GITHUB_REF_NAME}" "${archive}" checksums.txt --clobber
