# Curated GGUF models for Fallow pilots — see ADR 103.
#
# `flw models pull --catalog <id>` reads an entry, resolves its `hf:` source to a
# huggingface.co download URL, applies the metadata below, and refuses to
# register the blob if `sha256` is set and the download does not match it.
#
# Hash policy. `sha256` is the SHA-256 of the file content, taken from the Hugging
# Face LFS object id for that path at the pinned revision. `pull` recomputes it
# from the bytes it downloaded and compares, so a wrong value here fails the pull
# and never mislabels a blob. An entry whose hash nobody has confirmed leaves
# `sha256 = ""`: `pull` then registers the blob and prints the digest it computed,
# and that value is what belongs in this file.
#
# `min_ram_mb` follows the rule in `fallow_cli.gguf.derive_min_ram_mb` — 115% of
# the file plus 512 MiB — and is what ADR 048 matches against an agent's free RAM.
# `min_vram_mb` is 0 on every entry: these are CPU models, and a 0 keeps
# auto-assign from preferring a GPU desk. An operator serving one on a GPU sets
# `--min-vram-mb` at pull time.
#
# `license` names the upstream licence. Accepting it is the operator's job; this
# file records which one they are accepting, and nothing here accepts it for them.

[[model]]
id = "qwen2.5-0.5b-instruct-q4km"
source = "hf:Qwen/Qwen2.5-0.5B-Instruct-GGUF/qwen2.5-0.5b-instruct-q4_k_m.gguf"
family = "qwen2.5"
quant = "Q4_K_M"
worker_kind = "chat"
sha256 = "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db"
size_bytes = 491400032
min_ram_mb = 1051
min_vram_mb = 0
license = "apache-2.0"
note = "Smallest useful chat model; the size the Site Mode pilot runs on a four-desk LAN."

